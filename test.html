<!DOCTYPE html>
<html>
<head>
    <title>幸运大转盘</title>
    <style>
        #wheel-container { width: 300px; height: 300px; border: 5px solid #333; border-radius: 50%; position: relative; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); overflow: hidden; }
        .pointer { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid red; position: absolute; top: -20px; left: 130px; z-index: 10; }
        .input-group { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="pointer"></div>
    <div id="wheel-container">
        <!-- 这里可以用JS画扇形，或者简单放一张背景图 -->
        <img src="https://path-to-your-wheel-image.com/wheel.png" id="wheel" style="width:100%">
    </div>

    <div class="input-group">
        <input type="text" id="drawCode" placeholder="输入8位抽奖码">
        <input type="number" id="userId" placeholder="输入您的数字ID">
        <button onclick="startDraw()">开始抽奖</button>
    </div>

    <script>
        const WEB_APP_URL = "你的_APPS_SCRIPT_URL"; // 填入上面生成的URL

        async function startDraw() {
            const code = document.getElementById('drawCode').value;
            const userId = document.getElementById('userId').value;

            if(!code || !userId) return alert("请完整填写信息");

            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'draw', code: code, userId: userId })
            });

            const result = await response.json();

            if (result.status === "success") {
                // 模拟旋转动画
                const wheel = document.getElementById('wheel-container');
                const randomDeg = Math.floor(Math.random() * 360) + 3600; // 旋转10圈加随机角度
                wheel.style.transform = `rotate(${randomDeg}deg)`;

                setTimeout(() => {
                    alert(`恭喜！您抽中了：${result.prize}\n奖品详情：${result.desc}`);
                }, 4500);
            } else {
                alert(result.msg);
            }
        }
    </script>
</body>
</html>
