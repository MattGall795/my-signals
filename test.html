<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>至尊抽奖大转盘</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'PingFang SC', sans-serif; background: #2f3542; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; color: #333; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; width: 550px; }
        #wheel-canvas { width: 450px; height: 450px; border-radius: 50%; border: 8px solid #ff4757; transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1); }
        .wheel-container { position: relative; margin-bottom: 30px; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #ff4757; z-index: 10; }
        input { width: 100%; padding: 18px; margin: 10px 0; border: 2px solid #ddd; border-radius: 12px; font-size: 18px; box-sizing: border-box; }
        button { width: 100%; padding: 20px; background: #ff4757; color: white; border: none; border-radius: 12px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #ff6b81; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color: #ff4757; margin-bottom: 30px;">🎁 幸运大抽奖</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
    </div>

    <input type="text" id="drawCode" placeholder="输入 8 位抽奖码">
    <input type="number" id="userId" placeholder="输入您的纯数字 ID">
    <button onclick="doDraw()">立即抽奖</button>
</div>

<script>
    // ⚠️ 必须修改：这里填入你 Apps Script 部署后的 Web App URL
    const API_URL = "在这里粘贴你的_EXEC_结尾的URL";

    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    // 注意：转盘显示的奖品要和表格 Prizes 一一对应，这里仅作视觉展示
    const prizes = ["特等奖", "一等奖", "二等奖", "三等奖", "参与奖", "谢谢参与"];
    const colors = ["#ff9f43", "#ee5253", "#10ac84", "#54a0ff", "#5f27cd", "#c8d6e5"];

    function drawWheel() {
        const arc = Math.PI * 2 / prizes.length;
        for (let i = 0; i < prizes.length; i++) {
            ctx.fillStyle = colors[i];
            ctx.beginPath();
            ctx.arc(250, 250, 250, i * arc, (i + 1) * arc);
            ctx.lineTo(250, 250);
            ctx.fill();
            ctx.save();
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.translate(250 + Math.cos(i * arc + arc/2) * 160, 250 + Math.sin(i * arc + arc/2) * 160);
            ctx.rotate(i * arc + arc/2 + Math.PI/2);
            ctx.fillText(prizes[i], -ctx.measureText(prizes[i]).width/2, 0);
            ctx.restore();
        }
    }
    drawWheel();

    let rolling = false;
    async function doDraw() {
        if(rolling) return;
        const code = document.getElementById('drawCode').value.trim();
        const userId = document.getElementById('userId').value.trim();
        
        if(!code || !userId) return Swal.fire("错误", "请输入抽奖码和用户ID", "error");

        rolling = true;
        try {
            const resp = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "draw", code, userId })
            });
            const res = await resp.json();

            if(res.status === "success") {
                const deg = Math.floor(Math.random() * 360) + 3600; // 旋10圈
                canvas.style.transform = `rotate(${deg}deg)`;
                
                setTimeout(() => {
                    Swal.fire({
                        title: "恭喜！",
                        text: `您抽中了：${res.prize}\n(${res.desc})`,
                        icon: "success"
                    });
                    rolling = false;
                }, 5500);
            } else {
                Swal.fire("提示", res.msg, "warning");
                rolling = false;
            }
        } catch(e) {
            Swal.fire("系统繁忙", "请检查网络配置或URL是否正确", "error");
            rolling = false;
        }
    }
</script>
</body>
</html>
