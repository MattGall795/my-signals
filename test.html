<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>横版高级数据看板</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-gold: #f39c12;
      --table-blue: #3498db; /* 参考图中类似的蓝色 */
      --bg-dark: #1a1a1a;
    }
    body { margin: 0; background: var(--bg-dark); font-family: 'Segoe UI', Arial, sans-serif; }
    
    /* 登录 */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #222; padding: 30px; border-radius: 12px; width: 320px; text-align: center; color: white; }
    .login-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background: #333; color: white; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; background: var(--primary-gold); border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }

    #app-content { display: none; padding: 20px; text-align: center; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: #333; color: #ccc; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; }
    .tab-btn.active { background: var(--primary-gold); color: white; }

    /* 【核心】横版截图卡片 - 锁定 16:9 比例 */
    .snapshot-card {
      width: 1280px; /* 锁定宽度 */
      min-height: 720px; /* 锁定高度比例 */
      margin: 0 auto;
      background-size: cover !important;
      background-position: center !important;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    
    /* 顶部的标题区域 (占 1/4) */
    .header-area {
      width: 100%;
      height: 180px; /* 预留给 Logo 和主标题的空间 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .main-title {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      margin: 0;
      background: linear-gradient(to bottom, #fff, #ccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* 数据内容区域：玻璃悬浮效果 (占 3/4) */
    .data-container {
      width: 95%;
      background: rgba(255, 255, 255, 0.85); /* 半透明玻璃感 */
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* 表格样式复刻：参考图 2 */
    .data-table {
      width: 100%; 
      table-layout: fixed; /* 严格遵守手动调整的宽度 */
      border-collapse: collapse; 
      font-size: 13px;
      background: white;
    }
    .data-table th {
      background: linear-gradient(to bottom, #5dade2, #2e86c1); /* 蓝色渐变表头 */
      color: white;
      font-weight: bold;
      padding: 12px 5px;
      border: 1px solid #2980b9;
    }
    .data-table td {
      padding: 8px 4px;
      border: 1px solid #d6dbdf;
      color: #2c3e50;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: normal; /* 自动换行 */
      line-height: 1.2;
    }
    .data-table tr:nth-child(even) { background-color: #ebf5fb; } /* 浅蓝色条纹 */

    .btn-save {
      margin-top: 20px;
      padding: 15px 40px;
      background: var(--primary-gold);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>DATA SYSTEM</h2>
    <input type="text" id="api-url" placeholder="API URL" />
    <input type="text" id="user" placeholder="USER" />
    <input type="password" id="pass" placeholder="PASS" />
    <button onclick="doLogin()">SIGN IN</button>
  </div>
</div>

<div id="app-content">
  <div class="tabs" id="tabs"></div>
  <div id="card-outer">
     <!-- 截图区域 -->
     <div class="snapshot-card" id="capture-area">
        <div class="header-area">
           <h1 class="main-title" id="display-title">TITLE HERE</h1>
        </div>
        <div class="data-container" id="display-table">
           <!-- 表格将在这里生成 -->
        </div>
     </div>
  </div>
  <button class="btn-save" onclick="saveImage()">DOWNLOAD ANALYSIS PNG</button>
</div>

<script>
let rawData = [];
let bgBase64 = "";

async function doLogin() {
  const url = document.getElementById('api-url').value;
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  try {
    const res = await fetch(`${url}?u=${u}&p=${p}`);
    const json = await res.json();
    if(json.status === "success") {
      rawData = json.data;
      bgBase64 = json.bgImage;
      renderTabs();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    } else { alert("Login Failed: " + json.message); }
  } catch(e) { alert("Connection Error"); }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  rawData.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.innerText = item.sheetName;
    btn.onclick = () => showTab(idx);
    tabs.appendChild(btn);
  });
  showTab(0);
}

function showTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const item = rawData[idx];
  
  // 设置背景图和标题
  const card = document.getElementById('capture-area');
  card.style.background = `url('${bgBase64}')`;
  document.getElementById('display-title').innerText = item.title;

  let tablesHtml = "";
  item.sections.forEach(sec => {
    tablesHtml += renderTable(sec.tableData, sec.merges, sec.colWidths);
  });
  document.getElementById('display-table').innerHTML = tablesHtml;
}

function renderTable(data, merges, colWidths) {
  let skipMap = {};
  merges.forEach(m => {
    for(let r=0; r<m.rowSpan; r++) {
      for(let c=0; c<m.colSpan; c++) {
        if(r===0 && c===0) continue;
        skipMap[`${m.row+r},${m.col+c}`] = true;
      }
    }
  });

  let colGroup = '<colgroup>';
  colWidths.forEach(w => {
    colGroup += `<col style="width: ${w}px">`;
  });
  colGroup += '</colgroup>';

  let html = `<table class="data-table">${colGroup}<thead>`;
  data.forEach((row, rIdx) => {
    html += '<tr>';
    row.forEach((val, cIdx) => {
      if(skipMap[`${rIdx},${cIdx}`]) return;
      let m = merges.find(x => x.row === rIdx && x.col === cIdx);
      let attr = m ? `${m.rowSpan > 1 ? ' rowspan="'+m.rowSpan+'"' : ''}${m.colSpan > 1 ? ' colspan="'+m.colSpan+'"' : ''}` : '';
      let content = val.toString().replace(/\n/g, '<br>');
      html += rIdx === 0 ? `<th ${attr}>${content}</th>` : `<td ${attr}>${content}</td>`;
    });
    html += '</tr>';
    if(rIdx === 0) html += '</thead><tbody>';
  });
  return html + '</tbody></table>';
}

function saveImage() {
  const area = document.getElementById('capture-area');
  // 确保截图前滚动到顶部，防止错位
  window.scrollTo(0,0);
  html2canvas(area, { 
    scale: 2, 
    useCORS: true,
    allowTaint: true,
    backgroundColor: null 
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'Analysis_Result.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}
</script>
</body>
</html>
