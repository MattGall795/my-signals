<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Control PPT Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --gold: #f39c12; --dark: #0f0f0f; }
    body { margin: 0; background: var(--dark); font-family: 'Segoe UI', Arial, sans-serif; color: white; }
    
    /* Login */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #1a1a1a; padding: 40px; border-radius: 8px; width: 340px; text-align: center; border: 1px solid #333; }
    .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; }
    .login-box button { width: 100%; padding: 14px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; color: white; }

    /* Layout Control */
    #app-content { display: none; padding: 20px; text-align: center; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab { background: #222; color: #888; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; }
    .tab.active { background: var(--gold); color: white; }

    /* THE PPT CANVAS (FIXED 1280x720) */
    .slide-outer { width: 100%; display: flex; justify-content: center; margin-bottom: 50px; }
    .ppt-slide {
      width: 1280px; height: 720px; /* STRICT PPT RATIO */
      background-size: 100% 100% !important;
      background-position: center !important;
      position: relative; /* All elements inside are absolute */
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      overflow: hidden; /* Keep inside slide */
    }

    /* Absolute Title */
    .title-group {
      position: absolute; width: 100%; text-align: center;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8); z-index: 10;
    }
    .ppt-title { font-size: 50px; font-weight: 900; color: white; margin: 0; text-transform: uppercase; }
    .ppt-subtitle { font-size: 20px; color: #eee; margin-top: 5px; }

    /* Absolute & Scalable Table Box */
    .table-box {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 6px; padding: 15px; box-sizing: border-box;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      transform-origin: top left; /* Scale from top-left for easy positioning */
    }

    .ppt-table {
      width: 100%; table-layout: fixed; border-collapse: collapse;
      background: white; font-size: 13px; color: #333;
    }
    .ppt-table th { background: #2980b9; color: white; padding: 10px; border: 1px solid #21618c; }
    .ppt-table td { padding: 6px; border: 1px solid #d5d8dc; white-space: normal; line-height: 1.2; }
    .ppt-table tr:nth-child(even) { background-color: #f7fbff; }

    .download-btn { position: fixed; bottom: 30px; right: 30px; padding: 16px 40px; background: var(--gold); border-radius: 50px; border: none; color: white; font-weight: bold; cursor: pointer; z-index: 100; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>PPT DASHBOARD</h2>
    <input type="text" id="user" placeholder="Username" />
    <input type="password" id="pass" placeholder="Password" />
    <button onclick="doLogin()">SIGN IN</button>
  </div>
</div>

<div id="app-content">
  <div class="tabs" id="tabs"></div>
  <div class="slide-outer">
    <div id="capture-zone" class="ppt-slide">
      <div id="title-layer" class="title-group">
        <h1 id="main-t" class="ppt-title"></h1>
        <div id="sub-t" class="ppt-subtitle"></div>
      </div>
      <div id="table-layer"></div>
    </div>
  </div>
  <button class="download-btn" onclick="savePNG()">DOWNLOAD SLIDE</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwhn_gGLONbPhB_i0EPFZLmfzG45WDKVmr2cMQe7neCXJgqv87wD1Fu93n6f9eqytouUQ/exec";
let masterData = [];
let bgImg = "";

async function doLogin() {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  try {
    const r = await fetch(`${API}?u=${u}&p=${p}`);
    const j = await r.json();
    if (j.status === "success") {
      masterData = j.data; bgImg = j.bgImage;
      buildApp();
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app-content').style.display='block';
    } else { alert(j.message); }
  } catch(e) { alert("Connect Error"); }
}

function buildApp() {
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  masterData.forEach((page, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.innerText = `PAGE ${i+1}`;
    b.onclick = () => renderPage(i);
    tabs.appendChild(b);
  });
  renderPage(0);
}

function renderPage(idx) {
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', i === idx));
  const page = masterData[idx];
  
  document.getElementById('capture-zone').style.background = `url('${bgImg}')`;
  
  // 1. 位置控制 - 标题
  const titleLayer = document.getElementById('title-layer');
  titleLayer.style.left = page.titleX + "px";
  titleLayer.style.top = page.titleY + "px";
  document.getElementById('main-t').innerText = page.title;
  document.getElementById('sub-t').innerText = page.subtitle;

  // 2. 位置控制 - 表格
  let html = "";
  page.sections.forEach(sec => {
    const style = `left: ${sec.x}px; top: ${sec.y}px; transform: scale(${sec.scale});`;
    html += `<div class="table-box" style="${style}">${generateTable(sec)}</div>`;
  });
  document.getElementById('table-layer').innerHTML = html;
}

function generateTable(sec) {
  const { tableData, merges, colWidths, hAligns, vAligns } = sec;
  let skip = {};
  merges.forEach(m => {
    for(let r=0; r<m.rowSpan; r++) {
      for(let c=0; c<m.colSpan; c++) {
        if(r===0 && c===0) continue;
        skip[`${m.row+r},${m.col+c}`] = true;
      }
    }
  });
  let colG = '<colgroup>'; colWidths.forEach(w => colG += `<col style="width:${w}px">`); colG += '</colgroup>';
  let h = `<table class="ppt-table">${colG}<thead>`;
  tableData.forEach((row, rIdx) => {
    h += '<tr>';
    row.forEach((txt, cIdx) => {
      if(skip[`${rIdx},${cIdx}`]) return;
      let m = merges.find(x => x.row === rIdx && x.col === cIdx);
      let sp = m ? `${m.rowSpan>1?' rowspan="'+m.rowSpan+'"':''}${m.colSpan>1?' colspan="'+m.colSpan+'"':''}` : '';
      let al = `text-align:${hAligns[rIdx][cIdx]}; vertical-align:${vAligns[rIdx][cIdx]};`;
      let val = txt.toString().replace(/\n/g, '<br>');
      h += rIdx === 0 ? `<th ${sp} style="${al}">${val}</th>` : `<td ${sp} style="${al}">${val}</td>`;
    });
    h += '</tr>';
    if(rIdx === 0) h += '</thead><tbody>';
  });
  return h + '</tbody></table>';
}

function savePNG() {
  html2canvas(document.getElementById('capture-zone'), { scale: 2, useCORS: true }).then(canvas => {
    const a = document.createElement('a'); a.download = 'Slide.png'; a.href = canvas.toDataURL(); a.click();
  });
}
</script>
</body>
</html>
