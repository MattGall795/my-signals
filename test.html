<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Landscape Presentation Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --gold: #f39c12;
      --blue: #2980b9;
      --dark: #0a0a0a;
    }
    body { margin: 0; background: var(--dark); font-family: 'Segoe UI', Arial, sans-serif; color: white; }
    
    /* Login */
    #login-module { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #1a1a1a; padding: 40px; border-radius: 8px; width: 340px; text-align: center; border: 1px solid #333; }
    .login-box h2 { color: var(--gold); margin-bottom: 25px; font-weight: 300; letter-spacing: 2px; }
    .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }

    /* Layout */
    #app-content { display: none; padding: 20px; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-item { background: #252525; color: #777; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; }
    .tab-item.active { background: var(--gold); color: white; }

    /* PPT SLIDE - LOCKED WIDTH 1280px, AUTO HEIGHT */
    .slide-outer { width: 100%; display: flex; justify-content: center; padding-bottom: 80px; }
    .ppt-slide {
      width: 1280px;      /* Lock width for Landscape Poster feel */
      min-height: 720px;  /* Minimum 16:9 starting height */
      height: auto;       /* ALLOW HEIGHT TO GROW to show all rows */
      background-size: cover !important; /* Elegant cover instead of stretch */
      background-position: center top !important;
      background-repeat: no-repeat !important;
      background-attachment: scroll;
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      border: 1px solid #444; box-sizing: border-box;
      padding-bottom: 60px; /* Space at the bottom */
      overflow: visible;   /* DO NOT CLIP ANYTHING */
    }

    .header-box {
      width: 100%; min-height: 150px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-top: 20px; text-align: center;
    }
    .ppt-title {
      font-size: 50px; font-weight: 900; color: #fff;
      text-transform: uppercase; margin: 0;
      text-shadow: 0 5px 15px rgba(0,0,0,0.9);
      background: linear-gradient(to bottom, #ffffff, #cccccc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .ppt-subtitle {
      font-size: 22px; color: #f1f1f1; margin-top: 10px; font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      background: rgba(0,0,0,0.4); padding: 5px 20px; border-radius: 5px;
    }

    .table-container {
      width: 94%;
      height: auto; /* Important: Show everything */
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(15px);
      border-radius: 8px; padding: 25px; box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      margin-top: 20px;
      overflow: visible; /* Important: Show everything */
    }

    .ppt-table {
      width: 100%; table-layout: fixed; border-collapse: collapse;
      background: white; font-size: 13px; /* Slightly larger for readability */
    }
    .ppt-table th {
      background: linear-gradient(to bottom, #3498db, #2980b9);
      color: white; font-weight: bold; padding: 14px 5px;
      border: 1px solid #21618c; text-transform: uppercase;
    }
    .ppt-table td {
      padding: 10px 8px; border: 1px solid #d5d8dc;
      color: #333; line-height: 1.5;
      word-wrap: break-word; overflow-wrap: break-word; white-space: normal;
    }
    .ppt-table tr:nth-child(even) { background-color: #f8fbff; }

    .download-btn {
      position: fixed; bottom: 30px; right: 30px;
      padding: 18px 40px; background: var(--gold);
      color: white; border: none; border-radius: 50px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 9999;
    }
  </style>
</head>
<body>

<div id="login-module">
  <div class="login-card">
    <h2>SYSTEM LOGIN</h2>
    <input type="text" id="user" placeholder="Username" />
    <input type="password" id="pass" placeholder="Password" />
    <button onclick="handleLogin()">SIGN IN</button>
  </div>
</div>

<div id="app-content">
  <div class="tabs" id="tabs-bar"></div>
  <div class="slide-outer">
    <div id="capture-zone" class="ppt-slide">
      <div class="header-box">
        <h1 id="main-title" class="ppt-title">TITLE</h1>
        <div id="sub-title" class="ppt-subtitle">SUBTITLE</div>
      </div>
      <div id="table-wrap" class="table-container"></div>
    </div>
  </div>
  <button class="download-btn" onclick="takeSnapshot()">DOWNLOAD FULL PNG</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwhn_gGLONbPhB_i0EPFZLmfzG45WDKVmr2cMQe7neCXJgqv87wD1Fu93n6f9eqytouUQ/exec";

let allData = [];
let bgBase64 = "";

async function handleLogin() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  try {
    const res = await fetch(`${API_URL}?u=${encodeURIComponent(u)}&p=${encodeURIComponent(p)}`);
    const json = await res.json();
    if (json.status === "success") {
      allData = json.data;
      bgBase64 = json.bgImage;
      buildTabs();
      document.getElementById('login-module').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    } else { alert("Error: " + json.message); }
  } catch (e) { alert("Connection Error"); }
}

function buildTabs() {
  const nav = document.getElementById('tabs-bar');
  nav.innerHTML = '';
  allData.forEach((item, i) => {
    const b = document.createElement('button');
    b.className = 'tab-item' + (i === 0 ? ' active' : '');
    b.innerText = item.sheetName.toUpperCase();
    b.onclick = () => showSlide(i);
    nav.appendChild(b);
  });
  showSlide(0);
}

function showSlide(idx) {
  document.querySelectorAll('.tab-item').forEach((b, i) => b.classList.toggle('active', i === idx));
  const item = allData[idx];
  
  const slide = document.getElementById('capture-zone');
  slide.style.background = `url('${bgBase64}')`;
  document.getElementById('main-title').innerText = item.title;
  
  // 修复副标题展示
  const subtitle = item.sections[0].subtitle || "";
  const subEl = document.getElementById('sub-title');
  if (subtitle) {
    subEl.innerText = subtitle;
    subEl.style.display = "block";
  } else {
    subEl.style.display = "none";
  }

  let html = "";
  item.sections.forEach(sec => {
    html += generateTable(sec);
  });
  document.getElementById('table-wrap').innerHTML = html;
}

function generateTable(sec) {
  const { tableData, merges, colWidths, hAligns, vAligns } = sec;
  let skip = {};
  merges.forEach(m => {
    for(let r=0; r<m.rowSpan; r++) {
      for(let c=0; c<m.colSpan; c++) {
        if(r===0 && c===0) continue;
        skip[`${m.row+r},${m.col+c}`] = true;
      }
    }
  });

  let cols = '<colgroup>';
  colWidths.forEach(w => { cols += `<col style="width: ${w}px">`; });
  cols += '</colgroup>';

  let html = `<table class="ppt-table">${cols}<thead>`;
  tableData.forEach((row, rIdx) => {
    html += '<tr>';
    row.forEach((txt, cIdx) => {
      if(skip[`${rIdx},${cIdx}`]) return;
      let m = merges.find(x => x.row === rIdx && x.col === cIdx);
      let span = m ? `${m.rowSpan > 1 ? ' rowspan="'+m.rowSpan+'"' : ''}${m.colSpan > 1 ? ' colspan="'+m.colSpan+'"' : ''}` : '';
      
      // 应用对齐
      let style = `text-align: ${hAligns[rIdx][cIdx]}; vertical-align: ${vAligns[rIdx][cIdx] === 'middle' ? 'middle' : vAligns[rIdx][cIdx]};`;
      
      let clean = txt.toString().replace(/\n/g, '<br>');
      html += rIdx === 0 ? `<th ${span} style="${style}">${clean}</th>` : `<td ${span} style="${style}">${clean}</td>`;
    });
    html += '</tr>';
    if(rIdx === 0) html += '</thead><tbody>';
  });
  return html + '</tbody></table>';
}

function takeSnapshot() {
  const zone = document.getElementById('capture-zone');
  // 关键：捕捉完整高度，而不只是屏幕可见区域
  window.scrollTo(0,0);
  html2canvas(zone, { 
    scale: 2, 
    useCORS: true, 
    width: 1280, 
    windowWidth: 1280,
    backgroundColor: "#000" 
  }).then(canvas => {
    const a = document.createElement('a');
    a.download = `Full_Report_${new Date().getTime()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
