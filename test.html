<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --accent-gold: #f39c12;
      --border-alpha: rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'Segoe UI', sans-serif; margin: 0;
      /* 网页外部大背景改为纯深色 */
      background: #1a1a1a; 
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: white;
    }

    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a1a; 
      display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.5s ease;
    }
    .login-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 300px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .login-box h2 { margin-bottom: 25px; letter-spacing: 2px; font-weight: 900; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; outline: none;}
    .login-box button { width: 100%; padding: 12px; background: var(--accent-gold); border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; transition: 0.3s; }
    .login-box button:hover { background: #e67e22; transform: scale(1.03); }
    #login-error { color: #ff6b6b; font-size: 13px; margin-top: 15px; display: none; font-weight: 700; }

    #main-wrapper { display: none; width: 100%; flex-direction: column; align-items: center; padding: 20px 40px 120px 40px; box-sizing: border-box; }
    
    .tabs-container { margin-top: 20px; margin-bottom: 30px; display: flex; gap: 12px; padding: 8px 15px; background: rgba(255,255,255, 0.1); border-radius: 50px; z-index: 900; }
    .tab-btn { padding: 10px 22px; border: none; border-radius: 40px; background: transparent; color: #fff; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 13px; }
    .tab-btn.active { background: var(--accent-gold); color: white; }

    /* 数据卡片：这里将会被赋予你上传的背景图 */
    .slide-card { 
      display: none; 
      border-radius: 24px; padding: 50px; 
      box-shadow: 0 30px 70px rgba(0,0,0,0.6); 
      width: 100%; max-width: 1200px; 
      color: #000; /* 卡片内文字改为黑色以适应可能有明亮部分的背景图 */
      box-sizing: border-box; 
      position: relative;
      overflow: hidden;
    }
    .slide-card.active { display: inline-block; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    
    .title-box h1 { margin: 0; font-size: 38px; font-weight: 900; text-transform: uppercase; text-align: center; margin-bottom: 20px;}
    .section-subtitle { margin: 40px 0 15px 0; font-size: 20px; font-weight: 800; border-left: 5px solid var(--accent-gold); padding-left: 15px; }
    
    /* 恢复高清图片展示样式 */
    .sheet-img { width: 100%; height: auto; border-radius: 8px; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: block; margin-bottom: 20px;}

    .btn-download { position: fixed; bottom: 40px; right: 40px; padding: 18px 35px; background: var(--accent-gold); color: white; border: none; border-radius: 60px; cursor: pointer; font-weight: 800; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2000; }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h2>SECURE LOGON</h2>
      <input type="text" id="user-input" placeholder="USERNAME">
      <input type="password" id="pass-input" placeholder="PASSWORD">
      <button onclick="attemptLogin()">CONNECT</button>
      <div id="login-error">INVALID CREDENTIALS</div>
    </div>
  </div>

  <div id="main-wrapper">
    <div class="tabs-container" id="tabs-nav"></div>
    <div id="app-content"></div>
    <button class="btn-download" onclick="exportToPNG()">DOWNLOAD PNG SNAPSHOT</button>
  </div>

  <script>
    // ！！！务必确认这里是你最新发布的 API_URL ！！！
    const API_URL = 'https://script.google.com/macros/s/AKfycbwhn_gGLONbPhB_i0EPFZLmfzG45WDKVmr2cMQe7neCXJgqv87wD1Fu93n6f9eqytouUQ/exec';

    async function attemptLogin() {
      const u = document.getElementById('user-input').value;
      const p = document.getElementById('pass-input').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.querySelector('.login-box button');

      if (!u || !p) return;
      errorEl.style.display = 'none'; btn.innerText = "LOADING DATA...";

      try {
        const response = await fetch(`${API_URL}?u=${encodeURIComponent(u)}&p=${encodeURIComponent(p)}`);
        const result = await response.json();

        if (result.status === "success") {
          document.getElementById('login-screen').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-wrapper').style.display = 'flex';
            // 将背景图 URL 传给渲染函数
            render(result.data, result.bgImage);
          }, 500);
        } else {
          errorEl.innerText = result.message; errorEl.style.display = 'block'; btn.innerText = "CONNECT";
        }
      } catch (err) {
        errorEl.innerText = "CONNECTION FAILED"; errorEl.style.display = 'block'; btn.innerText = "CONNECT";
      }
    }
    document.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });

    // 渲染函数：将背景图绑定到卡片上
    function render(slidesData, bgImageUrl) {
      const container = document.getElementById('app-content'); 
      const tabsNav = document.getElementById('tabs-nav');
      container.innerHTML = ''; tabsNav.innerHTML = '';

      slidesData.forEach((slide, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = slide.sheetName; btn.onclick = () => switchTab(index);
        tabsNav.appendChild(btn);

        const card = document.createElement('div');
        card.className = `slide-card ${index === 0 ? 'active' : ''}`; 
        card.id = `card-${index}`;
        
        // 【核心修改】：把背景图赋予当前卡片，并加一个极淡的白色遮罩保证文字可读
        card.style.background = `linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35)), url('${bgImageUrl}')`;
        card.style.backgroundSize = "cover";
        card.style.backgroundPosition = "center";

        let contentHtml = `<div class="title-box"><h1>${slide.title}</h1></div>`;

        slide.sections.forEach(sec => {
          if (sec.subtitle) contentHtml += `<div class="section-subtitle">${sec.subtitle}</div>`;
          
          if (sec.type === "image" && sec.base64) {
            // 完美还原你在表格里排版的高清图片！
            contentHtml += `<img src="${sec.base64}" class="sheet-img" alt="Data Snapshot">`;
          } else if (sec.type === "error") {
            contentHtml += `<div style="color:red; font-weight:bold; margin-bottom:20px;">${sec.subtitle}</div>`;
          }
        });
        card.innerHTML = contentHtml; container.appendChild(card);
      });
    }

    function switchTab(index) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[index].classList.add('active');
      document.querySelectorAll('.slide-card').forEach(c => c.classList.remove('active'));
      document.getElementById(`card-${index}`).classList.add('active');
    }

    function exportToPNG() {
      const activeCard = document.querySelector('.slide-card.active');
      if(!activeCard) return;
      const originalRadius = activeCard.style.borderRadius;
      activeCard.style.borderRadius = '0'; // 下载时临时去掉圆角，让图片边缘完整
      
      html2canvas(activeCard, { useCORS: true, backgroundColor: null, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${document.querySelector('.tab-btn.active').innerText}.png`;
        link.href = canvas.toDataURL('image/png', 1.0); link.click();
        activeCard.style.borderRadius = originalRadius; // 恢复圆角
      });
    }
  </script>
</body>
</html>
