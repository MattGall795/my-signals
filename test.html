<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Analysis Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-gold: #f39c12;
      --table-blue: #2980b9;
      --bg-dark: #0f0f0f;
    }
    body { margin: 0; background: var(--bg-dark); font-family: 'Segoe UI', Arial, sans-serif; color: white; }
    
    /* Login Interface */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #1a1a1a; padding: 40px; border-radius: 15px; width: 360px; text-align: center; border: 1px solid #333; }
    .login-box h2 { margin-bottom: 25px; color: var(--primary-gold); }
    .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 14px; background: var(--primary-gold); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .login-box .hint { font-size: 12px; color: #666; margin-top: 10px; }

    /* App Layout */
    #app-content { display: none; padding: 20px; text-align: center; }
    .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
    .tab-btn { background: #2a2a2a; color: #999; border: none; padding: 10px 22px; border-radius: 25px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: var(--primary-gold); color: white; box-shadow: 0 4px 10px rgba(243,156,18,0.3); }

    /* LANDSCAPE SNAPSHOT AREA (16:9) */
    .snapshot-container {
      width: 1280px; /* Fixed wide width */
      min-height: 720px; /* Minimum landscape height */
      margin: 0 auto;
      background-size: cover !important;
      background-position: center !important;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
      box-sizing: border-box;
    }
    
    .header-area {
      width: 100%;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 5px 15px rgba(0,0,0,0.8);
    }
    .main-title {
      font-size: 48px; font-weight: 900; color: #fff;
      text-transform: uppercase; margin: 0;
      background: linear-gradient(to bottom, #ffffff, #d1d1d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Glassmorphism Data Box */
    .data-box {
      width: 92%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 12px;
      padding: 25px;
      margin: 10px 0 40px 0;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      color: #333;
    }

    /* Professional Table Style */
    .data-table {
      width: 100%; 
      table-layout: fixed; /* Respect manual column widths */
      border-collapse: collapse; 
      font-size: 13px;
      background: white;
      border: 1px solid #ccc;
    }
    .data-table th {
      background: linear-gradient(to bottom, #3498db, #2980b9); /* Blue gradient */
      color: white; font-weight: bold;
      padding: 12px 5px; border: 1px solid #2471a3;
    }
    .data-table td {
      padding: 8px 5px; border: 1px solid #d5d8dc;
      word-wrap: break-word; overflow-wrap: break-word;
      white-space: normal; line-height: 1.3; text-align: center;
    }
    .data-table tr:nth-child(even) { background-color: #f2f9ff; }

    .btn-download {
      position: fixed; bottom: 30px; right: 30px;
      padding: 18px 35px; background: var(--primary-gold);
      color: white; border: none; border-radius: 50px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 100;
    }
    .btn-download:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>DASHBOARD LOGIN</h2>
    <input type="text" id="api-url" placeholder="Apps Script API URL" />
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">SIGN IN</button>
    <p class="hint">API URL will be saved for your next visit.</p>
  </div>
</div>

<div id="app-content">
  <div class="tabs" id="tabs"></div>
  <div id="capture-area" class="snapshot-container">
    <div class="header-area">
      <h1 id="display-title" class="main-title">REPORT TITLE</h1>
    </div>
    <div id="display-content" class="data-box"></div>
  </div>
  <button class="btn-download" onclick="downloadImage()">DOWNLOAD PNG SNAPSHOT</button>
</div>

<script>
let dashboardData = [];
let backgroundImage = "";

// Auto-fill URL from localStorage
window.onload = () => {
  const savedUrl = localStorage.getItem('gas_api_url');
  if (savedUrl) {
    document.getElementById('api-url').value = savedUrl;
  }
};

async function login() {
  const url = document.getElementById('api-url').value.trim();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();

  if (!url || !u || !p) {
    alert("Please fill all fields"); return;
  }

  // Save URL for next time
  localStorage.setItem('gas_api_url', url);

  try {
    const response = await fetch(`${url}?u=${encodeURIComponent(u)}&p=${encodeURIComponent(p)}`);
    const result = await response.json();

    if (result.status === "success") {
      dashboardData = result.data;
      backgroundImage = result.bgImage;
      renderTabs();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    } else {
      alert("Login Failed: " + result.message);
    }
  } catch (e) {
    alert("Connection Error. Please check your URL or Network.");
  }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  dashboardData.forEach((item, index) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
    btn.innerText = item.sheetName.toUpperCase();
    btn.onclick = () => switchTab(index);
    tabs.appendChild(btn);
  });
  switchTab(0);
}

function switchTab(index) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === index));
  const item = dashboardData[index];
  
  const container = document.getElementById('capture-area');
  container.style.background = `url('${backgroundImage}')`;
  document.getElementById('display-title').innerText = item.title;

  let html = "";
  item.sections.forEach(sec => {
    html += renderTable(sec.tableData, sec.merges, sec.colWidths);
  });
  document.getElementById('display-content').innerHTML = html;
}

function renderTable(data, merges, widths) {
  let skipMap = {};
  merges.forEach(m => {
    for(let r=0; r<m.rowSpan; r++) {
      for(let c=0; c<m.colSpan; c++) {
        if(r===0 && c===0) continue;
        skipMap[`${m.row+r},${m.col+c}`] = true;
      }
    }
  });

  let colGroup = '<colgroup>';
  widths.forEach(w => { colGroup += `<col style="width: ${w}px">`; });
  colGroup += '</colgroup>';

  let html = `<table class="data-table">${colGroup}<thead>`;
  data.forEach((row, rIdx) => {
    html += '<tr>';
    row.forEach((val, cIdx) => {
      if(skipMap[`${rIdx},${cIdx}`]) return;
      let m = merges.find(x => x.row === rIdx && x.col === cIdx);
      let attr = m ? `${m.rowSpan > 1 ? ' rowspan="'+m.rowSpan+'"' : ''}${m.colSpan > 1 ? ' colspan="'+m.colSpan+'"' : ''}` : '';
      let cleanVal = val.toString().replace(/\n/g, '<br>');
      html += rIdx === 0 ? `<th ${attr}>${cleanVal}</th>` : `<td ${attr}>${cleanVal}</td>`;
    });
    html += '</tr>';
    if(rIdx === 0) html += '</thead><tbody>';
  });
  return html + '</tbody></table>';
}

function downloadImage() {
  const area = document.getElementById('capture-area');
  window.scrollTo(0,0);
  html2canvas(area, { 
    scale: 2, 
    useCORS: true,
    backgroundColor: "#000" 
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `Analysis_Report_${new Date().getTime()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}
</script>
</body>
</html>
