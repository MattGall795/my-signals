<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>高级数据看板</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-gold: #f39c12;
      --table-teal: #4ecdc4;
      --bg-dark: #121212;
    }
    body { margin: 0; background: var(--bg-dark); font-family: 'Segoe UI', Arial, sans-serif; color: white; }
    
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
    .login-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; background: var(--primary-gold); border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }

    #app-content { display: none; padding: 20px; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: #333; color: #ccc; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; }
    .tab-btn.active { background: var(--primary-gold); color: white; }

    .snapshot-card {
      max-width: 1100px; margin: 0 auto;
      background-size: cover !important;
      background-position: center top !important;
      border-radius: 20px; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    
    .hero-gap { width: 100%; aspect-ratio: 16 / 9; background: transparent; }

    .data-container {
      background: rgba(255, 255, 255, 0.98);
      color: #333;
      padding: 30px 25px 50px 25px;
      margin: -40px 20px 20px 20px;
      border-radius: 15px;
      min-height: 400px;
      box-sizing: border-box;
    }

    .main-title { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 30px; color: #000; }
    
    /* 关键：表格布局逻辑 */
    .data-table {
      width: 100%; 
      table-layout: fixed; /* 强制执行手动指定的列宽 */
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center;
      border: 1px solid #ddd;
      word-wrap: break-word; /* 允许单词内换行 */
      overflow-wrap: break-word;
    }
    .data-table th, .data-table td {
      padding: 8px 4px; 
      border: 1px solid #ddd;
      white-space: normal; /* 允许自动换行 */
      line-height: 1.4;
      vertical-align: middle;
    }
    .data-table th {
      background: var(--table-teal); color: white;
      font-weight: bold; border: 1px solid #fff;
    }
    .data-table tr:nth-child(even) { background: #f9f9f9; }

    .btn-save {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--primary-gold); color: white; border: none;
      padding: 15px 25px; border-radius: 50px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h3>数据看板系统</h3>
    <input type="text" id="api-url" placeholder="API URL" />
    <input type="text" id="user" placeholder="用户名" />
    <input type="password" id="pass" placeholder="密码" />
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app-content">
  <div class="tabs" id="tabs"></div>
  <div id="card-container"></div>
  <button class="btn-save" onclick="saveImage()">下载 PNG 快照</button>
</div>

<script>
let rawData = [];
let bgBase64 = "";

async function doLogin() {
  const url = document.getElementById('api-url').value;
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  try {
    const res = await fetch(`${url}?u=${u}&p=${p}`);
    const json = await res.json();
    if(json.status === "success") {
      rawData = json.data;
      bgBase64 = json.bgImage;
      renderTabs();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    } else { alert(json.message); }
  } catch(e) { alert("连接失败"); }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  rawData.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.innerText = item.sheetName;
    btn.onclick = () => showTab(idx);
    tabs.appendChild(btn);
  });
  showTab(0);
}

function showTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const container = document.getElementById('card-container');
  const item = rawData[idx];

  let sectionsHtml = "";
  item.sections.forEach(sec => {
    sectionsHtml += renderTable(sec.tableData, sec.merges, sec.colWidths);
  });

  container.innerHTML = `
    <div class="snapshot-card" id="capture-area" style="background: url('${bgBase64}')">
      <div class="hero-gap"></div>
      <div class="data-container">
        <div class="main-title">${item.title}</div>
        ${sectionsHtml}
      </div>
    </div>
  `;
}

function renderTable(data, merges, colWidths) {
  let skipMap = {};
  merges.forEach(m => {
    for(let r=0; r<m.rowSpan; r++) {
      for(let c=0; c<m.colSpan; c++) {
        if(r===0 && c===0) continue;
        skipMap[`${m.row+r},${m.col+c}`] = true;
      }
    }
  });

  // 使用 colgroup 定义每一列的宽度
  let colGroup = '<colgroup>';
  colWidths.forEach(w => {
    colGroup += `<col style="width: ${w}px">`;
  });
  colGroup += '</colgroup>';

  let html = `<table class="data-table">${colGroup}<thead>`;
  data.forEach((row, rIdx) => {
    html += '<tr>';
    row.forEach((val, cIdx) => {
      if(skipMap[`${rIdx},${cIdx}`]) return;
      let m = merges.find(x => x.row === rIdx && x.col === cIdx);
      let attr = m ? `${m.rowSpan > 1 ? ' rowspan="'+m.rowSpan+'"' : ''}${m.colSpan > 1 ? ' colspan="'+m.colSpan+'"' : ''}` : '';
      
      // 处理内容中的换行符，将其转为 HTML 换行
      let content = val.replace(/\n/g, '<br>');
      
      html += rIdx === 0 ? `<th ${attr}>${content}</th>` : `<td ${attr}>${content}</td>`;
    });
    html += '</tr>';
    if(rIdx === 0) html += '</thead><tbody>';
  });
  return html + '</tbody></table>';
}

function saveImage() {
  const area = document.getElementById('capture-area');
  html2canvas(area, { 
    scale: 2, 
    useCORS: true,
    logging: false,
    backgroundColor: "#121212" 
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'Report_' + new Date().getTime() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}
</script>
</body>
</html>
